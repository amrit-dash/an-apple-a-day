name: Supabase Keep Alive Ping

on:
  schedule:
    # Runs every day at midnight UTC to prevent Supabase Free Tier auto-pausing
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL and SUPABASE_ANON_KEY must be set in repository secrets."
            echo "Go to Settings > Secrets and variables > Actions to add them."
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          # A simple GET request to the REST API root is enough to count as activity
          # We check the HTTP status code
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 400 ] || [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Failed to ping Supabase, unexpected status: $HTTP_STATUS"
            exit 1
          fi
