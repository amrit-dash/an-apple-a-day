name: Supabase Keep Alive Ping

on:
  schedule:
    # Runs every day at midnight UTC to prevent Supabase Free Tier auto-pausing
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL and SUPABASE_ANON_KEY must be set in repository secrets."
            echo "Go to Settings > Secrets and variables > Actions to add them."
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          # A simple GET request to the REST API root is enough to count as activity
          # The -s flag makes it silent, -f makes it fail on HTTP errors (e.g., 404, 500)
          curl -s -f \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/"
          
          echo "Successfully pinged Supabase!"
