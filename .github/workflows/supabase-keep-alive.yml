name: Supabase Keep Alive Ping

on:
  schedule:
    # Runs every day at 02:37 UTC (08:07 AM IST) to avoid peak GitHub Actions congestion and prevent Supabase auto-pausing
    - cron: "37 2 * * *"
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL and SUPABASE_ANON_KEY must be set in repository secrets."
            echo "Go to Settings > Secrets and variables > Actions to add them."
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          # We query an actual table ('doctors') to ensure it counts as database activity.
          # Hitting /auth/v1/health does not touch the Postgres database and will not prevent auto-pausing.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/doctors?select=id&limit=1")
          
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Failed to ping Supabase, unexpected status: $HTTP_STATUS"
            exit 1
          fi
